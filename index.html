<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#131618">
  <meta name="description" content="Alle deutschen Verkehrszeichen spielerisch lernen – für die Führerscheinprüfung.">
  <title>Schilderwald</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 1 31 16 16 31 1 16z' fill='%23fff'/%3E%3Cpath d='M16 6 26 16 16 26 6 16z' fill='%23f5c400'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="headlight" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="Schilderwald – zur Startseite">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 1 31 16 16 31 1 16z" fill="#fff"/><path d="M16 5.5 26.5 16 16 26.5 5.5 16z" fill="#f5c400"/></svg>
      <span>Schilderwald</span>
    </a>
    <div class="odo" title="Dein Kilometerstand – jede richtige Antwort bringt dich weiter">
      <span class="odo-digits"></span><span class="odo-unit">km</span>
    </div>
    <button class="icon-btn sound-toggle" aria-label="Ton an oder aus" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z" fill="currentColor" stroke="none"/>
        <path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>
        <path class="mute" d="M16 9.5l5 5M21 9.5l-5 5"/>
      </svg>
    </button>
    <span class="route-line" aria-hidden="true"></span>
  </header>

  <main id="app" tabindex="-1"></main>

  <div class="sheet" hidden role="dialog" aria-modal="true" aria-label="Zeichen-Details">
    <div class="sheet-bg"></div>
    <div class="sheet-panel"></div>
  </div>

  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/MorphSVGPlugin.min.js"></script>
  <script src="data/signs.js"></script>
  <script src="data/explain.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
